<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To Sam</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050000;
  font-family:'Segoe UI',Arial,sans-serif;
}

#canvas-container{
  position:absolute;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
  cursor:pointer;
}

#dedication{
  position:absolute;
  bottom:42px;
  left:50%;
  transform:translateX(-50%);
  color:#f5c9a1;
  font-family:'Dancing Script',cursive;
  font-size:30px;
  font-weight:600;
  letter-spacing:1px;
  text-shadow:
    0 0 8px rgba(255,80,30,.6),
    0 0 18px rgba(255,80,30,.4),
    0 0 32px rgba(255,50,20,.2);
  pointer-events:none;
  opacity:.98;
}

#hint{
  position:absolute;
  bottom:82px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,210,180,.45);
  font-size:10px;
  letter-spacing:2px;
  opacity:.8;
  pointer-events:none;
  transition:opacity .3s;
}

#letter{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(7px);
  opacity:0;
  visibility:hidden;
  transition:opacity .45s ease,visibility .45s ease;
  padding:25px;
  box-sizing:border-box;
}

#letter.show{
  opacity:1;
  visibility:visible;
}

.paper{
  position:relative;
  width:min(560px,90vw);
  max-height:75vh;
  box-sizing:border-box;
  padding:55px 48px 45px;
  overflow:auto;

  background:
    linear-gradient(
      135deg,
      rgba(255,245,226,.98),
      rgba(247,224,196,.98)
    );

  border:1px solid rgba(255,190,130,.65);

  box-shadow:
    0 0 35px rgba(255,80,30,.18),
    0 20px 70px rgba(0,0,0,.65);

  color:#48251d;

  transform:
    translateY(25px)
    scale(.94)
    rotateX(8deg);

  transition:
    transform .55s cubic-bezier(.2,.8,.2,1);
}

#letter.show .paper{
  transform:
    translateY(0)
    scale(1)
    rotateX(0);
}

.paper::before{
  content:"";
  position:absolute;
  inset:13px;
  border:1px solid rgba(120,55,30,.18);
  pointer-events:none;
}

#close{
  position:absolute;
  top:18px;
  right:20px;
  width:32px;
  height:32px;
  border:none;
  background:transparent;
  color:#67372b;
  font-size:25px;
  cursor:pointer;
  opacity:.7;
  transition:.2s;
}

#close:hover{
  opacity:1;
  transform:scale(1.1);
}

.paper h2{
  margin:0 0 28px;
  text-align:center;
  font-family:'Dancing Script',cursive;
  font-size:34px;
  font-weight:600;
  letter-spacing:1px;
  color:#6d3025;
}

#message{
  font-family:Georgia,serif;
  font-size:17px;
  line-height:1.8;
  color:#4b2b24;
  white-space:pre-line;
}

.signature{
  margin-top:28px;
  text-align:right;
  font-family:'Dancing Script',cursive;
  font-size:22px;
  color:#7b4739;
}
</style>
</head>

<body>

<div id="canvas-container"></div>

<div id="dedication">to Sam</div>

<div id="hint">TOUCH THE FLOWER</div>

<div id="letter">
  <div class="paper">
    <button id="close">×</button>

    <h2>For You</h2>

    <div id="message"></div>

    <div class="signature">— Simon</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

function linspace(a,b,n){
  const out=new Float64Array(n);
  const step=(b-a)/(n-1);

  for(let i=0;i<n;i++){
    out[i]=a+step*i;
  }

  return out;
}

function mod(a,n){
  return ((a%n)+n)%n;
}

function computeRoseGrid(nx,ntheta){

  const xs=linspace(0,1,nx);
  const thetas=linspace(-2*Math.PI,15*Math.PI,ntheta);

  const pos=new Float32Array(nx*ntheta*3);
  const colors=new Float32Array(nx*ntheta*3);

  let index=0;

  for(let i=0;i<nx;i++){

    const x=xs[i];

    for(let j=0;j<ntheta;j++){

      const theta=thetas[j];

      const phi=
        (Math.PI/2)*
        Math.exp(-theta/(8*Math.PI));

      const Xs=
        1-
        0.5*
        Math.pow(
          (5/4)*
          Math.pow(
            1-
            mod(3.6*theta,2*Math.PI)/Math.PI,
            2
          )-
          1/4,
          2
        );

      const y=
        1.95653*
        x*x*
        Math.pow(1.27689*x-1,2)*
        Math.sin(phi);

      const r=
        Xs*
        (x*Math.sin(phi)+y*Math.cos(phi));

      const X3=r*Math.sin(theta);
      const Y3=r*Math.cos(theta);

      const Z3=
        Xs*
        (x*Math.cos(phi)-y*Math.sin(phi));

      pos[index*3]=X3;
      pos[index*3+1]=Z3;
      pos[index*3+2]=Y3;

      const t=i/(nx-1);

      colors[index*3]=1;
      colors[index*3+1]=.08+.55*t;
      colors[index*3+2]=.015+.08*t;

      index++;
    }
  }

  return {pos,colors};
}

function buildGeometry(nx,ntheta){

  const data=computeRoseGrid(nx,ntheta);
  const indices=[];

  for(let i=0;i<nx-1;i++){

    for(let j=0;j<ntheta-1;j++){

      const a=i*ntheta+j;
      const b=a+1;
      const c=a+ntheta;
      const d=c+1;

      indices.push(a,c,b);
      indices.push(b,c,d);
    }
  }

  const geometry=new THREE.BufferGeometry();

  geometry.setAttribute(
    'position',
    new THREE.BufferAttribute(data.pos,3)
  );

  geometry.setAttribute(
    'color',
    new THREE.BufferAttribute(data.colors,3)
  );

  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  return geometry;
}

const container=
  document.getElementById('canvas-container');

const scene=new THREE.Scene();

scene.background=
  new THREE.Color(0x050000);

const camera=
  new THREE.PerspectiveCamera(
    42,
    window.innerWidth/window.innerHeight,
    .01,
    100
  );

const renderer=
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputEncoding=
  THREE.sRGBEncoding;

container.appendChild(renderer.domElement);

scene.add(
  new THREE.AmbientLight(
    0xff4b2b,
    .8
  )
);

const light=
  new THREE.PointLight(
    0xff3b18,
    3.5,
    20
  );

light.position.set(2,2,4);

scene.add(light);

const light2=
  new THREE.PointLight(
    0xff9a35,
    2.5,
    15
  );

light2.position.set(-3,-1,-2);

scene.add(light2);

const group=
  new THREE.Group();

scene.add(group);

const geometry=
  buildGeometry(80,800);

const material=
  new THREE.MeshBasicMaterial({
    vertexColors:true,
    side:THREE.DoubleSide,
    transparent:true,
    opacity:.94
  });

const rose=
  new THREE.Mesh(
    geometry,
    material
  );

group.add(rose);

const glowMaterial=
  new THREE.MeshBasicMaterial({
    vertexColors:true,
    side:THREE.DoubleSide,
    transparent:true,
    opacity:.12,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });

const glow=
  new THREE.Mesh(
    geometry,
    glowMaterial
  );

glow.scale.set(
  1.035,
  1.035,
  1.035
);

group.add(glow);

const sparkleGeometry=
  new THREE.BufferGeometry();

const sparkleCount=260;

const sparklePositions=
  new Float32Array(
    sparkleCount*3
  );

for(let i=0;i<sparkleCount;i++){

  const angle=
    Math.random()*Math.PI*2;

  const radius=
    .7+Math.random()*1.8;

  const height=
    (Math.random()-.5)*2.2;

  sparklePositions[i*3]=
    Math.cos(angle)*radius;

  sparklePositions[i*3+1]=
    height;

  sparklePositions[i*3+2]=
    Math.sin(angle)*radius;
}

sparkleGeometry.setAttribute(
  'position',
  new THREE.BufferAttribute(
    sparklePositions,
    3
  )
);

const sparkleMaterial=
  new THREE.PointsMaterial({
    color:0xffd6a0,
    size:.035,
    transparent:true,
    opacity:.85,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });

const sparkles=
  new THREE.Points(
    sparkleGeometry,
    sparkleMaterial
  );

group.add(sparkles);

geometry.computeBoundingSphere();

const sphere=
  geometry.boundingSphere;

const distance=
  sphere.radius*2.65;

camera.position.set(
  distance*.55,
  distance*.18,
  distance*.9
);

camera.lookAt(
  sphere.center
);

let time=0;

function animate(){

  requestAnimationFrame(animate);

  time+=.016;

  group.rotation.y+=.0025;

  group.position.y=
    Math.sin(time*.7)*.035;

  glowMaterial.opacity=
    .09+
    Math.sin(time*2.2)*.045;

  sparkleMaterial.opacity=
    .55+
    Math.sin(time*2.5)*.3;

  sparkles.rotation.y=
    -time*.08;

  sparkles.rotation.x=
    Math.sin(time*.35)*.04;

  renderer.render(
    scene,
    camera
  );
}

animate();

const letter=
  document.getElementById('letter');

const close=
  document.getElementById('close');

const hint=
  document.getElementById('hint');

const letterText=
`Hiii twin!
I hope you're doing very great!

I don't know if you're aware, but September 21st is the day to celebrate the tradition of yellow flowers and, as you know, I’ve told you about that "Love and Friendship" custom from my country. I didn't want to miss the chance to mark the occasion.

Thanks for being such an amazing friend; I always have fun with you and love chatting a bit every day. I really appreciate you, and well, I hope you like this little surprise I planned for today.`;

document.getElementById(
  'message'
).textContent=letterText;

function openLetter(){

  letter.classList.add('show');

  hint.style.opacity='0';
}

function closeLetter(){

  letter.classList.remove('show');

  setTimeout(()=>{
    hint.style.opacity='.8';
  },450);
}

renderer.domElement.addEventListener(
  'click',
  openLetter
);

close.addEventListener(
  'click',
  closeLetter
);

letter.addEventListener(
  'click',
  e=>{
    if(e.target===letter){
      closeLetter();
    }
  }
);

window.addEventListener(
  'resize',
  ()=>{

    camera.aspect=
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

</script>

</body>
</html>
